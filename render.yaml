services:
  - type: web
    name: authjs-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000
      - key: SECRET_JWT_SEED
        sync: false
      - key: MONGODB
        sync: false
